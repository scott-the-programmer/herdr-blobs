name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Check source syntax and JSON
        run: |
          for source_file in mods/*/*.js; do
            node --input-type=module --check < "$source_file"
          done
          python3 -m compileall -q demo mods tests
          for json_file in layouts/*.json mods/*/mod.json; do
            python3 -m json.tool "$json_file" > /dev/null
          done
      - name: Run JavaScript regression tests
        run: node --test tests/*.test.mjs
      - name: Run Python regression tests
        run: python3 -m unittest discover -s tests -p '*_test.py'
